apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pytorch-training

resources:
  # Namespace
  - namespace.yaml

  # Storage
  - data-pvc.yaml
  - output-pvc.yaml

  # Config and scripts
  - train-config.yaml
  - training-script-configmap.yaml

  # Networking
  - service.yaml

  # Distributed training job
  - training-job.yaml
